name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.6.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      OPENPASTE_ARCH: universal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and release
        env:
          GH_TOKEN: ${{ github.token }}
          OPENPASTE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/version.py)"
          {
            echo "OPENPASTE_VERSION=$VERSION"
            echo "ASSET_NAME=OpenPaste-$VERSION-macos-universal"
          } >> "$GITHUB_ENV"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | @json" > "$RUNNER_TEMP/releases.jsonl"
          python3 - "$RUNNER_TEMP/releases.jsonl" <<'PY'
          import json, os, sys
          with open(sys.argv[1]) as stream:
              release = next((item for line in stream if (item := json.loads(line))['tag_name'] == os.environ['RELEASE_TAG']), None)
          if release is None:
              sys.exit('Create the release or draft before starting the build.')
          if release.get('immutable', False):
              sys.exit('Release is immutable. Upload assets to a draft release using workflow_dispatch before publishing.')
          PY

      - name: Unit tests
        run: ./scripts/unit-tests.sh

      - name: Install check tools
        run: brew install gitleaks swiftlint actionlint

      - name: Code standards
        run: ./scripts/lint.sh

      - name: Dependency vulnerability scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependency-scan.py

      - name: Security tests and secret scan
        run: ./scripts/security-check.sh

      - name: Inject Firebase configuration
        env:
          OPENPASTE_FIREBASE_CONFIG_B64: ${{ secrets.OPENPASTE_FIREBASE_CONFIG_B64 }}
        run: python3 scripts/inject_firebase_config.py

      - name: Import signing certificate
        env:
          OPENPASTE_SIGNING_P12_B64: ${{ secrets.OPENPASTE_SIGNING_P12_B64 }}
          OPENPASTE_SIGNING_P12_PASSWORD: ${{ secrets.OPENPASTE_SIGNING_P12_PASSWORD }}
          OPENPASTE_SIGNING_IDENTITY: ${{ secrets.OPENPASTE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for name in OPENPASTE_SIGNING_P12_B64 OPENPASTE_SIGNING_P12_PASSWORD OPENPASTE_SIGNING_IDENTITY; do
            [ -n "${!name}" ] || { echo "::error::Missing secret $name; refusing to publish an ad-hoc signed build."; exit 1; }
          done
          keychain="$RUNNER_TEMP/openpaste-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$OPENPASTE_SIGNING_P12_B64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$OPENPASTE_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          security find-identity -p codesigning "$keychain" | grep -F "$OPENPASTE_SIGNING_IDENTITY"
          echo "OPENPASTE_SIGNING_IDENTITY=$OPENPASTE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "OPENPASTE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build universal application
        run: ./build.sh

      - name: Verify analytics bundle
        run: python3 Tests/analytics-config-test.py

      - name: Verify embedded version and architecture
        run: |
          python3 - <<'PY'
          import os, plistlib
          with open('build/OpenPaste.app/Contents/Info.plist', 'rb') as stream:
              info = plistlib.load(stream)
          assert info['OpenPasteReleaseVersion'] == os.environ['OPENPASTE_VERSION']
          assert info['CFBundleShortVersionString'] == os.environ['OPENPASTE_VERSION'].split('-')[0]
          assert info['CFBundleVersion'] == os.environ['GITHUB_RUN_NUMBER']
          PY
          lipo build/OpenPaste.app/Contents/MacOS/OpenPaste -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/OpenPaste.app
          requirement="$(codesign -dr - build/OpenPaste.app 2>&1)"
          echo "$requirement"
          grep -q 'certificate leaf = H"' <<< "$requirement" || { echo "::error::Signature requirement is not certificate based; Accessibility permission would reset on update."; exit 1; }
          if grep -q 'cdhash' <<< "$requirement"; then echo "::error::Ad-hoc signature detected."; exit 1; fi

      - name: Package and checksum
        run: |
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent build/OpenPaste.app "build/release/$ASSET_NAME.zip"
          (cd build/release && shasum -a 256 "$ASSET_NAME.zip" > "$ASSET_NAME.sha256")

      - name: Keep workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Keep debug symbols in Actions only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}-debug-symbols
          path: build/OpenPaste.app.dSYM
          if-no-files-found: error
          retention-days: 14

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "build/release/$ASSET_NAME.zip" "build/release/$ASSET_NAME.sha256" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${OPENPASTE_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$OPENPASTE_SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/signing.p12"
