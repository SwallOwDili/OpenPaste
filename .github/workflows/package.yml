name: Check and package
on:
  workflow_run:
    workflows: [Test and security]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Test and security run ID to recheck after CLA signing
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      branch: ${{ steps.target.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify test run, current commit and CLA
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run?.id || Number(context.payload.inputs.run_id);
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:runId});
            const {data: workflow} = await github.rest.actions.getWorkflow({...context.repo, workflow_id:'ci.yml'});
            if (run.workflow_id !== workflow.id || run.conclusion !== 'success' || run.repository.full_name !== context.payload.repository.full_name || !['pull_request','push','workflow_dispatch'].includes(run.event)) throw new Error('A successful repository test/security run is required');
            let head = run.head_sha, branch = run.head_branch;
            if (run.event === 'pull_request') {
              const prs = await github.paginate(github.rest.pulls.list,{...context.repo,state:'open',per_page:100});
              const pr = prs.find(p=>p.head.sha===head && p.head.ref===branch);
              if (!pr) throw new Error('Tested PR commit is no longer current');
              const {hasAcceptedStatus} = require('./.github/scripts/cla.cjs');
              if (!await hasAcceptedStatus(github, context.repo, head)) throw new Error('CLA acceptance required before packaging');
              branch = pr.head.ref;
            } else {
              const {data: current} = await github.rest.repos.getBranch({...context.repo,branch});
              if (current.commit.sha !== head) throw new Error('Branch advanced; wait for its new test run');
            }
            core.setOutput('sha',head); core.setOutput('branch',branch);
  package:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Isolated runner: PR code gets no Firebase secret and no write token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Build application
        env:
          GITHUB_HEAD_REF: ${{ needs.verify.outputs.branch }}
        run: ./build.sh
      - name: Verify bundle
        run: python3 Tests/analytics-config-test.py
      - name: Package application
        env:
          GITHUB_HEAD_REF: ${{ needs.verify.outputs.branch }}
        run: |
          VERSION="$(python3 scripts/version.py)"
          SAFE_VERSION="${VERSION//\//-}"
          echo "ARTIFACT_NAME=OpenPaste-$SAFE_VERSION-macos-$(uname -m)" >> "$GITHUB_ENV"
          mkdir -p build/package
          ditto -c -k --sequesterRsrc --keepParent build/OpenPaste.app "build/package/OpenPaste-$SAFE_VERSION-macos-$(uname -m).zip"
          (cd build/package && shasum -a 256 ./*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/package/*
          if-no-files-found: error
          retention-days: 30
