name: CLA acceptance
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  cla:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && github.event.comment.body == 'I have read and agree to the OpenPaste CLA v1.0.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
    concurrency:
      group: cla-signatures
      cancel-in-progress: false
    steps:
      # Always run trusted default-branch code, never the contributor's checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {check} = require('./.github/scripts/cla.cjs');
            const number = context.payload.pull_request?.number || context.payload.issue.number;
            const pr = await check({github, context, core, number, signing: context.eventName === 'issue_comment'});
            if (context.eventName === 'issue_comment' && pr.claAccepted) {
              const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'ci.yml', head_sha:pr.head.sha, status:'success', per_page:10});
              const run = runs.data.workflow_runs.find(r=>r.event === 'pull_request');
              if (run) await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id:'package.yml', ref:context.payload.repository.default_branch, inputs:{run_id:String(run.id)}});
            }
