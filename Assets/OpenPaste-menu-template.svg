  <title id="menu-title">OpenPaste menu bar template</title>
  <desc id="menu-description">A monochrome alpha-template version of the OpenPaste paper P. Optimized for an 18-point menu bar slot. The background and inner counter are transparent; the silhouette is solid black. Material effects and the paper-face seam are omitted for small-size clarity.</desc>
